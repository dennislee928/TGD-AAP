name: Cron 1 - ETL Pipeline

on:
  schedule:
    - cron: "0 2 * * *" # Run daily at 02:00 UTC
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-etl-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('.github/workflows/cron_etl.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-etl-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-etl-

      - name: Build data engine
        run: cargo build --release --bin data_engine

      - name: Run ETL pipeline
        env:
          GOV_API_KEY: ${{ secrets.GOV_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATASET_VERSION: ${{ vars.DATASET_VERSION }}
        run: cargo run --release --bin data_engine
