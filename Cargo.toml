[package]
name = "tgd-aap"
version = "0.1.0"
edition = "2021"
description = "Taiwan Gov Data AI Automation Pipeline"
license = "MIT"

[[bin]]
name = "data_engine"
path = "src/data_engine/main.rs"

[[bin]]
name = "grpc_client"
path = "src/grpc_client.rs"

[[bin]]
name = "grpc_server"
path = "src/main.rs"

[dependencies]
# gRPC & Protobuf
tonic = { version = "0.11", features = ["tls"] }
prost = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# HTTP client for government API calls
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Async utilities
futures = "0.3"

# UUID generation
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
